<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Абонемент — Legion Taekwondo Team</title>
<style>
:root{--ink:#14161a;--paper:#f6f4f0;--red:#c49b63;--ok:#21fd8f;--warn:#b86e00;--mute:#6b6f76}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink);color:var(--paper);font-family:"Time New Romans"}
.card{width:100%;max-width:380px;background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden}
.top{background:var(--red);color:#fff;padding:16px 20px;font-size:1.45rem;font-weight:700}
.top small{display:block;font-weight:400;opacity:.85;margin-top:2px}
.body{padding:24px 20px 28px}
.name{margin:0 0 20px;font-size:1.6rem;font-weight:700}
.days{font-size:4.6rem;font-weight:800;line-height:1}
.days-label{margin:4px 0 20px;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:#e1ddd6;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .6s}
.until{margin:16px 0 0;font-size:1.05rem}
.left{margin:6px 0 0;color:var(--mute)}
.state{margin-top:18px;padding:10px 12px;border-radius:8px;font-weight:600;color:#fff;background:var(--ok)}
.state.soon{background:var(--warn)}
.state.over{background:var(--red)}
.msg{font-size:1.1rem;line-height:1.5}
form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
form input{font:inherit;font-size:1.5rem;padding:12px;text-align:center;letter-spacing:.12em;border:2px solid #c9c4ba;border-radius:10px}
form input:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red)}
form button{font:inherit;font-size:1.1rem;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer}
.err{margin:10px 0 0;color:var(--red);font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="top">Legion Taekwondo Team<small>Абонемент</small></div>
  <div class="body" id="out"><p class="msg">Загрузка…</p></div>
</main>
<script>
const out = document.getElementById('out');
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function msg(text){
  out.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'msg';
  p.textContent = text;
  out.appendChild(p);
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function plural(n, a, b, c){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
  return c;
}

function render(s){
  if (!s) return msg('Карта не найдена. Покажите её тренеру.');
  if (!s.name || !s.until) return msg('Карта ещё не активирована. Обратитесь к тренеру.');

  const [y, m, d] = s.until.split('-').map(Number);
  const until = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((until - today) / 86400000);

  out.innerHTML = '';
  out.appendChild(el('h1', 'name', s.name));

  const over = days < 0;
  out.appendChild(el('div', 'days', over ? '0' : String(days)));
  out.appendChild(el('div', 'days-label', over ? 'дней осталось' : plural(days, 'день остался', 'дня осталось', 'дней осталось')));

  const bar = el('div', 'bar'); const fill = document.createElement('i');
  bar.appendChild(fill); out.appendChild(bar);
  fill.style.width = Math.max(0, Math.min(100, days / 30 * 100)) + '%';
  if (days <= 7) fill.style.background = over ? 'var(--red)' : 'var(--warn)';

  out.appendChild(el('p', 'until', 'Оплачено до ' + d + ' ' + MONTHS[m - 1] + ' ' + y));
  if (typeof s.left === 'number') {
    out.appendChild(el('p', 'left', 'Осталось занятий: ' + s.left));
  }

  let cls = 'state', text = 'Абонемент действует';
  if (over) { cls += ' over'; text = 'Абонемент закончился. Продлите у тренера'; }
  else if (days <= 7) { cls += ' soon'; text = 'Скоро закончится. Не забудьте продлить'; }
  out.appendChild(el('div', cls, text));
}

function normalize(v){ return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function showForm(error){
  out.innerHTML = '';
  out.appendChild(el('p', 'msg', 'Введите номер с вашей карты'));
  const f = document.createElement('form');
  const i = document.createElement('input');
  i.type = 'text'; i.autocomplete = 'off'; i.autocapitalize = 'none'; i.spellcheck = false;
  i.maxLength = 12; i.placeholder = 'например k7x9q2'; i.setAttribute('aria-label', 'Номер карты');
  const b = el('button', '', 'Показать абонемент'); b.type = 'submit';
  f.appendChild(i); f.appendChild(b);
  f.onsubmit = e => {
    e.preventDefault();
    const c = normalize(i.value);
    if (c) location.search = '?c=' + c;
  };
  out.appendChild(f);
  if (error) out.appendChild(el('p', 'err', error));
  i.focus();
}

const code = normalize(new URLSearchParams(location.search).get('c'));
if (!code) {
  showForm();
} else {
  fetch('data.json', {cache: 'no-store'})
    .then(r => r.json())
    .then(data => {
      if (Object.prototype.hasOwnProperty.call(data, code)) render(data[code]);
      else showForm('Такой карты нет. Проверьте номер.');
    })
    .catch(() => msg('Не удалось загрузить данные. Попробуйте позже.'));
}
</script>
</body>
</html>
